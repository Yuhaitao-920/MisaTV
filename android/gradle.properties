org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# 旧插件（flutter_js 等）的 Kotlin(1.8) 与 Java(11) 目标不一致，新版 Gradle 默认报
# 错；设为 warning 仅告警不中断构建（不修改插件源码）。
kotlin.jvm.target.validation.mode=warning
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Maven Central / Gradle Plugin Portal 会对共享 IP（如 GitHub runner）限流，
# 表现为 HTTP 429 Too Many Requests，一次构建失败重跑就好。
# 提高超时并允许重试，能吸收掉大部分这类偶发失败。
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1500
