name: build

on:
  # main 也纳入：此前只监听 mod，导致合并到 main 的改动完全没有 CI 兜底
  # （曾有 20 个编译错误的提交差点直接进 main）。
  push:
    branches: [mod, main]
  pull_request:
    branches: [mod, main]
  # 发 Release 时出正式包并挂到 release 资产上。
  release:
    types: [published]
  # 手动触发时可指定 release tag，把产物直接挂到该 release 上
  # （用于发版后某个平台构建失败、需要单独补产物的场景）。
  workflow_dispatch:
    inputs:
      release_tag:
        description: '把产物挂到这个 tag 的 release（留空则只出 Actions artifact）'
        required: false
        default: ''

# 需要写权限才能把产物挂到 release 资产（gh release upload）。
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: analyze + test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: 环境信息
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        # 已知偶发：整套测试在 CI 上偶尔被整体中止，受害者随机（表现为某个 test
        # 文件整批 did not complete、单跑该文件却全过，日志里没有任何超时或异常）。
        # 已实测：同一 runner、同一提交，单独跑 3 次全过，全量串行也 +984 全过，
        # 所以这是环境抖动而非用例缺陷，用重试吸收；连试 3 次仍失败即真实失败。
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "--- 第 $attempt 次尝试"
            if flutter test --reporter compact --concurrency=1; then
              echo "测试通过（第 $attempt 次）"
              exit 0
            fi
            echo "::warning::第 $attempt 次测试失败，重试"
          done
          echo "::error::连续 3 次测试失败，判定为真实失败"
          exit 1

      - name: 失败时打印诊断
        if: failure()
        run: flutter doctor -v

  windows:
    name: windows release
    # 固定在 VS 2022 镜像：windows-latest 已是 VS 2026（MSVC 14.51），
    # flutter_inappwebview_windows 依赖 <experimental/coroutine>，在 VS 2026 下是硬错误。
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      # flutter_inappwebview_windows 的 CMake 依赖 NuGet 提供的头文件
      # （WebView2.h / WIL / nlohmann json）。插件自带的 DEPENDENCIES_DOWNLOAD 工程
      # 是构建期才下载的，配置阶段拿不到 include 路径，于是报
      #   error C1083: Cannot open include file: 'WebView2.h'
      # 这里在构建前预装并用 CL 注入 include 目录，配置阶段即可命中。
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: 预装 flutter_inappwebview_windows 原生依赖
        shell: pwsh
        run: |
          $pkgDir = (Resolve-Path ".").Path + "\build\windows\x64\packages"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          $src = "https://api.nuget.org/v3/index.json"
          nuget install Microsoft.Windows.ImplementationLibrary -Version 1.0.231216.1 -ExcludeVersion -OutputDirectory $pkgDir -Source $src
          if ($LASTEXITCODE -ne 0) { throw "nuget install WIL failed" }
          nuget install Microsoft.Web.WebView2 -Version 1.0.2792.45 -ExcludeVersion -OutputDirectory $pkgDir -Source $src
          if ($LASTEXITCODE -ne 0) { throw "nuget install WebView2 failed" }
          nuget install nlohmann.json -Version 3.11.2 -ExcludeVersion -OutputDirectory $pkgDir -Source $src
          if ($LASTEXITCODE -ne 0) { throw "nuget install nlohmann.json failed" }
          $inc1 = "$pkgDir\Microsoft.Web.WebView2\build\native\include"
          $inc2 = "$pkgDir\Microsoft.Windows.ImplementationLibrary\include"
          $inc3 = "$pkgDir\nlohmann.json\build\native\include"
          foreach ($d in @($inc1, $inc2, $inc3)) {
            if (-not (Test-Path $d)) { throw "头文件目录缺失: $d" }
          }
          $clFlags = "/I`"$inc1`" /I`"$inc2`" /I`"$inc3`""
          if ($env:CL) { $clFlags = "$env:CL $clFlags" }
          "CL=$clFlags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Exported CL=$clFlags"

      - name: 缓存运行时下载（JDK / dex2jar / Python）
        uses: actions/cache@v4
        with:
          path: .rtcache
          key: runtime-cache-${{ hashFiles('tool/prepare_windows_runtimes.ps1') }}

      # 把原本运行期按需下载的 JRE / dex2jar / 宿主库 / Python / unidbg 改成
      # 构建期准备、随包分发：用户首次用 jar / .py 蜘蛛不再需要下载 150MB+。
      # JRE 由 jlink 裁剪到约 42MB（模块清单见脚本内注释）。
      - name: 准备随包运行时
        shell: pwsh
        run: ./tool/prepare_windows_runtimes.ps1

      - name: 构建 Windows Release
        run: flutter build windows --release

      - name: 打包（排除 userdata）
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { throw "构建产物不存在：$src" }
          # App-local VC++ runtime: without these a clean Windows install that
          # has no vc_redist crashes at startup before Flutter creates a window.
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $path = Join-Path $src $dll
            if (-not (Test-Path $path)) { throw "缺少 VC++ 运行库：$path（未装 vc_redist 的用户会闪退）" }
          }
          $stage = Join-Path $env:RUNNER_TEMP "misatv-win"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # 显式排除 userdata：本地跑过会生成订阅 / 历史 / 登录态，绝不能进发布包。
          Copy-Item -Path (Join-Path $src '*') -Destination $stage -Recurse -Force -Exclude 'userdata'
          # 随包运行时：放到 exe 旁的 runtime/，App 启动时优先用它，缺失才回落下载。
          $rt = 'runtime'
          foreach ($need in @(
              'jre/bin/java.exe',
              'jre/legal/java.base/LICENSE',
              'd2j/dex-tools-v2.4.jar',
              'python/python.exe',
              'unidbg/unidbg-android-0.9.9.jar')) {
            if (-not (Test-Path (Join-Path $rt $need))) {
              throw "缺少随包运行时：$rt/$need（先跑 tool/prepare_windows_runtimes.ps1）"
            }
          }
          Copy-Item -Path $rt -Destination $stage -Recurse -Force
          $zip = "MisaTV-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          # 断言：包里不能出现 userdata，防止排除逻辑失效后静默上线。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $a = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          $bad = @($a.Entries | Where-Object { $_.FullName -like 'userdata*' })
          $rtOk = @($a.Entries | Where-Object { $_.FullName -eq 'runtime/jre/bin/java.exe' })
          $rtCount = @($a.Entries | Where-Object { $_.FullName -like 'runtime/*' }).Count
          $count = $a.Entries.Count
          $a.Dispose()
          if ($bad.Count -gt 0) { throw "发布包含有 userdata：$($bad.FullName -join ', ')" }
          if ($rtOk.Count -eq 0) { throw '发布包缺少随包运行时 runtime/jre/bin/java.exe' }
          Write-Host "随包运行时条目=$rtCount"
          Write-Host "文件数=$count 体积=$((Get-Item $zip).Length) 字节"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MisaTV-windows-x64
          path: MisaTV-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: 挂到 Release 资产
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG=$EVENT_TAG
          if [ -z "$TAG" ]; then TAG=$INPUT_TAG; fi
          if [ -z "$TAG" ]; then echo '::error::没有可用的 release tag'; exit 1; fi
          echo "upload to release: $TAG"
          gh release upload "$TAG" "MisaTV-windows-x64.zip" --clobber

      - name: 失败时打印诊断
        if: failure()
        run: flutter doctor -v
