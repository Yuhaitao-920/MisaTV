name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'windows/**'
      - 'web/**'
  release:
    types: [published]

# 允许上传构建产物（APK）
permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MisaTV APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 锁定到仓库设计目标版本：pubspec 要求 Flutter 3.47+/Dart ^3.13.7，
          # 且仓库自带 Gradle 9.3.1 + AGP 9.1.0 正是为该版本搭配；
          # 最新 stable 的 AGP 已移除 proguard-android.txt 支持，会导致
          # flutter_inappwebview 等老插件构建失败。
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking, report only)
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: misatv-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
