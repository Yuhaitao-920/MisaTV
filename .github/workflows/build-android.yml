name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      shell_jars:
        description: 'Restore optional assets/jvm/shell-real/*.jar from the SHELL_REAL_JARS_B64 secret (otherwise only jars committed to the repo are used)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'windows/**'
      - 'web/**'
  release:
    types: [published]

# 允许上传构建产物（APK）
permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MisaTV APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 锁定 3.47.0：自带 Dart 3.13.0（pubspec 已放宽到 >=3.13.0），
          # 且其 gradle 插件支持仓库自带的 AGP 9.1.0（proguard-android.txt 仍存在，
          # 保证 flutter_inappwebview 等老插件可构建）。最新 stable 强制 AGP>=9.1.1，
          # 会移除 proguard-android.txt 导致老插件失败，故不采用。
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      # 可选资源：assets/jvm/shell-real/*.jar 是第三方加固壳解包产物，
      # 版权归各自权利人，上游仓库不分发（.gitignore 也排除了它们）。
      # 只有你自行合法持有并放入仓库 / Secret 时，这一步才会把它们并入 assets。
      # pubspec.yaml 已声明 - assets/jvm/shell-real/，Flutter 会自动把目录内文件打进 APK。
      # 注意：Android 端走 ART / DexClassLoader（SpiderHostPlugin.kt），运行时不读取
      # 这些 jar；它们只服务于 Windows 桌面端的纯 Java 快路径。缺它们不影响 APK 功能。
      - name: Stage optional shell-real jars
        env:
          SHELL_REAL_JARS_B64: ${{ secrets.SHELL_REAL_JARS_B64 }}
        run: |
          mkdir -p assets/jvm/shell-real
          if [ "${{ inputs.shell_jars }}" = "true" ] && [ -n "$SHELL_REAL_JARS_B64" ]; then
            printf '%s' "$SHELL_REAL_JARS_B64" | base64 -d > /tmp/shell-real.tar.gz
            tar -xzf /tmp/shell-real.tar.gz -C assets/jvm/shell-real
            rm -f /tmp/shell-real.tar.gz
            echo "shell-real jars restored from SHELL_REAL_JARS_B64"
          fi
          shopt -s nullglob
          jars=(assets/jvm/shell-real/*.jar)
          echo "SHELL_JAR_COUNT=${#jars[@]}" >> "$GITHUB_ENV"
          echo "--- staged assets/jvm/shell-real ---"
          if [ ${#jars[@]} -eq 0 ]; then
            echo "(none) - optional; Android build stays fully functional"
            echo "::notice::No optional shell-real jars staged. Android uses ART/DexClassLoader and does not read these jars."
          else
            ls -lh "${jars[@]}"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking, report only)
        run: flutter analyze --no-fatal-infos || true

      - name: Patch flutter_inappwebview for AGP 9.1 compat
        # AGP 9.1 移除了 proguard-android.txt，老插件 flutter_inappwebview_android
        # 的 build.gradle 仍引用它导致构建失败。按官方建议改用 proguard-android-optimize.txt。
        # 仅修改 pub-cache 内的临时副本，仓库源码零侵入。
        run: |
          f=$(find "$HOME/.pub-cache" -path '*flutter_inappwebview_android*/android/build.gradle' 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$f"
            echo "patched: $f"
          else
            echo "flutter_inappwebview_android build.gradle not found, skip"
          fi

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      # 校验随包资源确实进了 APK，并生成清单方便核对。
      - name: Verify bundled shell-real assets
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$apk"
          unzip -l "$apk" | grep 'assets/flutter_assets/assets/jvm/shell-real/' > /tmp/shell_entries.txt || true
          jar_count=$(grep -c '\.jar$' /tmp/shell_entries.txt || true)
          {
            echo "APK: app-release.apk"
            echo "shell-real jars staged: $SHELL_JAR_COUNT"
            echo "shell-real jars bundled in APK: $jar_count"
            cat /tmp/shell_entries.txt
          } > build-manifest.txt
          cat build-manifest.txt

      # Flutter 3.47 的 release 构建会跑 R8。CatVod 宿主类只被外部 jar / 加固壳
      # dex 反射引用，若 proguard keep 失效会被裁掉或混淆成短名，APK 会在加载
      # 蜘蛛时抛 ClassNotFoundException —— 这里在 CI 里直接兜住。
      - name: Verify CatVod host classes survived R8
        run: |
          apk="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk"
          work=$(mktemp -d)
          unzip -o -q "$apk" 'classes*.dex' -d "$work"
          # 宿主 API 类 + 加固壳运行时链接的 Java 库：APK 自身代码完全不引用它们，
          # 只被外部 dex 链接，R8 最容易整包裁掉。用 -F 匹配 dex 里的类型描述符，
          # 注意 'Request$Builder' 里的 $ 必须放在单引号里，不能被 shell 展开。
          classes=(
            'Lcom/github/catvod/crawler/Spider;'
            'Lcom/github/catvod/crawler/SpiderApi;'
            'Lcom/github/catvod/crawler/SpiderDebug;'
            'Lcom/kniephos/kniephos/SpiderHostPlugin;'
            'Lokhttp3/Request$Builder;'
            'Lokhttp3/OkHttpClient;'
            'Lokio/Buffer;'
            'Lcom/google/gson/Gson;'
            'Lorg/jsoup/Jsoup;'
            'Lcom/alibaba/fastjson/JSON;'
          )
          ok=1
          for c in "${classes[@]}"; do
            if grep -a -q -F "$c" "$work"/classes*.dex; then
              echo "host class present: $c"
              echo "host class $c: present" >> build-manifest.txt
            else
              echo "::error::host class removed or obfuscated by R8: $c"
              echo "host class $c: MISSING" >> build-manifest.txt
              ok=0
            fi
          done
          test "$ok" -eq 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: misatv-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build-manifest.txt
          if-no-files-found: error
          retention-days: 30
