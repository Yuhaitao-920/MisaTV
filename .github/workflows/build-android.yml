name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'windows/**'
      - 'web/**'
  release:
    types: [published]

# 允许上传构建产物（APK）
permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MisaTV APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 锁定 3.47.0：自带 Dart 3.13.0（pubspec 已放宽到 >=3.13.0），
          # 且其 gradle 插件支持仓库自带的 AGP 9.1.0（proguard-android.txt 仍存在，
          # 保证 flutter_inappwebview 等老插件可构建）。最新 stable 强制 AGP>=9.1.1，
          # 会移除 proguard-android.txt 导致老插件失败，故不采用。
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking, report only)
        run: flutter analyze --no-fatal-infos || true

      - name: Patch flutter_inappwebview for AGP 9.1 compat
        # AGP 9.1 移除了 proguard-android.txt，老插件 flutter_inappwebview_android
        # 的 build.gradle 仍引用它导致构建失败。按官方建议改用 proguard-android-optimize.txt。
        # 仅修改 pub-cache 内的临时副本，仓库源码零侵入。
        run: |
          f=$(find "$HOME/.pub-cache" -path '*flutter_inappwebview_android*/android/build.gradle' 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$f"
            echo "patched: $f"
          else
            echo "flutter_inappwebview_android build.gradle not found, skip"
          fi

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: misatv-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
